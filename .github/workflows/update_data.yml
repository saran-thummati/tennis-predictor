name: Auto Update Tennis AI

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Download Tennis Dataset Natively
        uses: actions/checkout@v4
        with:
          repository: JeffSackmann/tennis_atp
          path: raw_tennis_data
          
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install pandas numpy scikit-learn joblib requests lightgbm
          
      - name: Run data updater script
        run: python data_updater.py
        
      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          date > last_updated.txt
          git add -f tennis_model_artifacts.pkl last_updated.txt
          git commit -m "Rollback to stable 8-feature model" || echo "No changes to commit"
          git push origin main
