name: Auto Update Tennis AI

on:
  schedule:
    # Runs at 8:00 AM UTC every Monday
    - cron: '0 8 * * 1'
  workflow_dispatch: # Allows you to run it manually

permissions:
  contents: write # Grants the robot permission to save the updated model

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install pandas numpy scikit-learn joblib requests xgboost
          
      - name: Run data updater script
        run: python data_updater.py
        
      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add -f tennis_model_artifacts.pkl
          git commit -m "Automated XGBoost model update" || echo "No changes to commit"
          git push origin main
